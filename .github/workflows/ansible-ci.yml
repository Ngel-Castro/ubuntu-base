---
name: Ansible CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: ansible-lint & yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml ansible/

      - name: Run ansible-lint
        run: ansible-lint ansible/

  molecule-apache:
    name: Molecule – apache role
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: |
          pip install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule test (apache)
        run: molecule test
        working-directory: ansible/roles/apache

  molecule-common:
    name: Molecule – common role
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: |
          pip install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule test (common)
        run: molecule test
        working-directory: ansible/roles/common
