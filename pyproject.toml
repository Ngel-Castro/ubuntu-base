[tool.poetry]
name = "base-ubuntu"
version = "0.1.0"
description = "Base images using packer"
authors = ["Angel Castro <castrobasurto.angel@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
ansible = "^10.1.0"
molecule = "^24.0.0"
molecule-plugins = {version = "^23.0.0", extras = ["docker"]}
ansible-lint = "^24.0.0"
yamllint = "^1.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
